# /opt/agentes/promtail.yml en app01 al terminar la UT1 (A1.4, 5 nov)
# Cambia IP_MON01 por la IP de mon01: un contenedor no lee el /etc/hosts de su máquina

server:
  http_listen_port: 29080

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://IP_MON01:23100/loki/api/v1/push
    external_labels:
      host: app01
      env: dev
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    timeout: 10s

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      # La API: saca level y request_id de su JSON
      - match:
          selector: '{service="app"}'
          stages:
            - json:
                expressions:
                  level: level
                  ts: ts
                  request_id: request_id
            - timestamp:
                source: ts
                format: RFC3339Nano
            - labels:
                level:
            - structured_metadata:
                request_id:
      # Las líneas de la API que no son JSON quedan marcadas
      - match:
          selector: '{service="app"} !~ "^\\{"'
          stages:
            - static_labels:
                malformed: "true"
      # Los eventos: la acción como etiqueta, el contenedor y su exitCode aparte
      - match:
          selector: '{service="docker-events"}'
          stages:
            - json:
                expressions:
                  action: Action
                  name: Actor.Attributes.name
                  exit_code: Actor.Attributes.exitCode
            - labels:
                action:
            - structured_metadata:
                name:
                exit_code:
