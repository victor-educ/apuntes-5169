# /opt/monitoring/prometheus.yml en mon01 al terminar la UT3 (A3.2, 1 dic; la evaluable del 3 dic no lo cambia)
# Lo que cambia respecto a la UT2: las IP fijas de la VPC dev, db01 en node y en postgres,
# y app01 en su propio job node-tls, cifrado y con contraseña.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [ "rules.yml", "alerts.yml" ]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:29093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:29090"]
        labels: { host: mon01 }

  # Lo que está en app01, en back
  - job_name: app
    static_configs:
      - targets: ["10.10.2.10:29102"]
        labels: { host: app01, service: app }

  - job_name: cadvisor
    static_configs:
      - targets: ["10.10.2.10:28081"]
        labels: { host: app01 }
    metric_relabel_configs:
      # el servicio de compose pasa a la etiqueta service
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - regex: container_label_.*
        action: labeldrop
      # solo las métricas que se usan en el curso
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|memory_usage_bytes|spec_memory_limit_bytes|network_(receive|transmit)_bytes_total|fs_(reads|writes)_bytes_total|oom_events_total|last_seen)
        action: keep

  # PostgreSQL y su exporter, en db01 (data) desde la A3.2
  - job_name: postgres
    static_configs:
      - targets: ["10.10.3.10:29187"]
        labels: { host: db01, service: db }

  # La máquina entera: mon01 y db01 en claro; app01 en node-tls
  - job_name: node
    static_configs:
      - targets: ["10.10.0.20:29100"]
        labels: { host: mon01 }
      - targets: ["10.10.3.10:29100"]
        labels: { host: db01 }

  - job_name: node-tls
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/tls/ca.crt
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/secrets/node_exporter.pass
    static_configs:
      - targets: ["10.10.2.10:29100"]
        labels: { host: app01 }

  # La propia cadena de logs
  - job_name: promtail
    static_configs:
      - targets: ["10.10.2.10:29080"]
        labels: { host: app01 }

  - job_name: loki
    static_configs:
      - targets: ["loki:23100"]
        labels: { host: mon01 }
