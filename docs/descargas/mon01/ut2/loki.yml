# /opt/monitoring/loki/loki.yml en mon01 al terminar la UT2: el de la UT1 más el bloque ruler (A2.2)

auth_enabled: false

server:
  http_listen_port: 23100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-10-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h              # 7 días
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_global_streams_per_user: 5000

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  compaction_interval: 10m
  retention_delete_delay: 2h

# A2.2: el ruler evalúa las alarmas de loki-alerts.yml y las manda a Alertmanager
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules              # de dónde lee las reglas
  rule_path: /tmp/loki-rules-scratch      # directorio de trabajo, no se toca
  alertmanager_url: http://alertmanager:29093
  enable_api: true                        # para consultar las reglas cargadas
  evaluation_interval: 1m
